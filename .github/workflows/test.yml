name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps --only-shell chromium
      - run: ruff check .
      - run: mypy app
      - run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          # On failure, repeat the end of the build log as an annotation (readable without signing in).
          if ! docker build --progress=plain -t doomsday-watcher . > build.log 2>&1; then
            cat build.log
            echo "::error title=docker build failed::$(grep -v -e "Downloading" -e "━" build.log | tail -25 | cut -c1-150 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          tail -5 build.log
      - name: Start and wait for /health
        run: |
          note() { echo "::error title=$1::$(printf '%s' "$2" | tail -25 | cut -c1-150 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/
/%0A/g')"; }
          # Host port 18080: something on the runner may already use 8080.
          if ! out=$(docker run -d --name w -p 18080:8080 --shm-size 256m               -e HOST=0.0.0.0 -e DASHBOARD_PASSWORD=ci-password-123 -e RUNNER=ci               doomsday-watcher 2>&1); then
            echo "$out"; note "docker run failed" "$out"; exit 1
          fi
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18080/health; then echo; docker logs w 2>&1 | tail -20; exit 0; fi
            sleep 3
          done
          logs=$(docker logs w 2>&1); echo "$logs"; note "container never became healthy" "$logs"; exit 1
      - name: Memory while checking (Render Starter has 512 MB)
        run: |
          peak=0
          for i in $(seq 1 45); do
            m=$(docker stats --no-stream --format '{{.MemUsage}}' w | cut -d/ -f1)
            echo "$m"
            mib=$(echo "$m" | awk '/GiB/{printf "%d", $1*1024; next} /MiB/{printf "%d", $1; next} {print 0}')
            [ "$mib" -gt "$peak" ] && peak=$mib
            sleep 2
          done
          echo "::notice title=memory::peak ${peak} MiB over 90 s (Render Starter has 512 MB)"
          docker logs w 2>&1 | grep '"check ' | tail -6 | cut -c1-200 | while read -r l; do echo "::notice title=check::$l"; done
