# Backup watcher: one check of every platform, alerts sent from here too.
#
# SCHEDULE OFF (24 Nov 2026): from GitHub's network both PVR and District answered HTTP 403 (CI run of 329fb38).
# Every scheduled run would fail and GitHub would email about each one. Run it by hand (Actions -> watch ->
# Run workflow) to re-test; if the platforms ever answer, restore:
#   schedule:
#     - cron: "*/5 * * * *"
name: watch

on:
  workflow_dispatch:

concurrency:
  group: watcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNNER: github
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.browsers
      NOTIFY_PROVIDERS: ${{ secrets.NOTIFY_PROVIDERS }}
      PUSHOVER_APP_TOKEN: ${{ secrets.PUSHOVER_APP_TOKEN }}
      PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      WA_CLOUD_TOKEN: ${{ secrets.WA_CLOUD_TOKEN }}
      WA_CLOUD_PHONE_NUMBER_ID: ${{ secrets.WA_CLOUD_PHONE_NUMBER_ID }}
      WA_CLOUD_TO: ${{ secrets.WA_CLOUD_TO }}
      WA_CLOUD_TEMPLATE: ${{ secrets.WA_CLOUD_TEMPLATE }}
      HEARTBEAT_URL: ${{ secrets.GITHUB_HEARTBEAT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Cache browser
        id: browser
        uses: actions/cache@v4
        with:
          path: .browsers
          key: chromium-${{ hashFiles('requirements.txt') }}

      - name: Install browser
        run: |
          if [ "${{ steps.browser.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps --only-shell chromium
          fi

      # The database carries what was already alerted from one run to the next.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: watcher-db-${{ github.run_id }}
          restore-keys: watcher-db-

      - name: Check once
        run: python -m app.main --once

      # One public line per platform, so results can be read without opening the log.
      - name: Report
        if: always()
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          db = pathlib.Path("data/watcher.db")
          if db.exists():
              for pid, state, kind, detail in sqlite3.connect(db).execute(
                  "SELECT id, state, error_kind, error_detail FROM platforms ORDER BY id"
              ):
                  print(f"::notice title={pid}::{state} {kind or ''} {(detail or '')[:200]}")
          PY

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: watcher-db-${{ github.run_id }}
